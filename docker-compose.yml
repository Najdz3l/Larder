services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-ts-app
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
